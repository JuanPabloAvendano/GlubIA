# ==========================================================================
#  GlubIA en Omarchy (o cualquier Linux con Docker)
#
#    cp .env.example .env        # y editalo
#    docker compose up -d        # GlubIA (UI + API) detras de Caddy
#    docker compose --profile tunel up -d    # + tunel Cloudflare con tu dominio
#    COMPOSE_PROFILES=ollama en .env         # + Ollama como motor (GLUBIA_MOTOR=ollama)
#    COMPOSE_PROFILES=tunel-rapido en .env   # + tunel rapido sin cuenta (URL aleatoria)
#    scripts/vigilar.sh                      # estado y enlaces en vivo
#
#  Topologia:
#
#    internet ─▶ tunel (cloudflared) ─┐   red "borde"        red "interna" (sin salida)
#    LAN/host ─▶ :8081 ───────────────┴─▶ web (Caddy) ───────▶ glubia :11434
#
#  * glubia vive SOLO en una red interna sin acceso a internet: aunque
#    quisiera, no puede enviar nada fuera. Solo Caddy llega a el.
#  * Con GLUBIA_MOTOR=ollama, glubia habla con el servicio ollama por la red
#    interna. Ollama tiene ademas la red "salida" para descargar modelos.
#  * :8081 = GlubIA privado (tu UI y la API completa). No lo publiques en
#    el tunel sin Cloudflare Access delante (ver docs/OMARCHY.md).
#  * El portafolio ya no vive aqui: es un repo aparte (~/Work/portafolio).
#  * Los puertos se enlazan a 127.0.0.1 por defecto (WEB_BIND en .env).
# ==========================================================================
name: glubia

services:
  glubia:
    image: ${GLUBIA_IMAGEN:-ghcr.io/cambia-esto/glubia}:${GLUBIA_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${GLUBIA_TAG:-dev}
    restart: unless-stopped
    # Variables explicitas (no env_file): asi el token del tunel u otros
    # secretos de .env nunca entran en este contenedor.
    environment:
      GLUBIA_PASS: ${GLUBIA_PASS:?Define GLUBIA_PASS en .env}
      GLUBIA_HORAS: ${GLUBIA_HORAS:-8}
      GLUBIA_TITULO: ${GLUBIA_TITULO:-GlubIA}
      GLUBIA_API_KEYS: ${GLUBIA_API_KEYS:-}
      GLUBIA_DEVICE: ${GLUBIA_DEVICE:-GPU}
      GLUBIA_MOTOR: ${GLUBIA_MOTOR:-openvino}
      GLUBIA_OLLAMA_URL: http://ollama:11434
      GLUBIA_OLLAMA_MODELO: ${GLUBIA_OLLAMA_MODELO:-huihui_ai/qwen3.5-abliterated:4B}
      GLUBIA_OLLAMA_KEEP: ${GLUBIA_OLLAMA_KEEP:--1}
      GLUBIA_OLLAMA_PENSAR: ${GLUBIA_OLLAMA_PENSAR:-0}
      GLUBIA_OLLAMA_GPU: ${GLUBIA_OLLAMA_GPU:-1}   # valor inicial; luego manda el panel
      GLUBIA_CTX: ${GLUBIA_CTX:-8192}
      GLUBIA_MAX_TOKENS: ${GLUBIA_MAX_TOKENS:-4096}
      GLUBIA_MAX_SEG: ${GLUBIA_MAX_SEG:-300}
      GLUBIA_COLA: ${GLUBIA_COLA:-8}
      GLUBIA_LOG: ${GLUBIA_LOG:-INFO}
      GLUBIA_DATA: /data
      GLUBIA_MODEL: /modelos/${GLUBIA_MODELO_DIR:-qwen2.5-coder-7b-int4-ov}
      GLUBIA_HOST: 0.0.0.0
      GLUBIA_PORT: "11434"
      GLUBIA_PROXIES: 172.31.0.20/32        # solo Caddy puede indicar la IP real del visitante
    volumes:
      - glubia-datos:/data                  # secreto, conversaciones, claves, cache de OpenVINO
      - ${GLUBIA_MODELOS:-./modelos}:/modelos:ro
    devices:
      - /dev/dri:/dev/dri                   # GPU Intel (compose.cpu.yaml lo quita)
    group_add:
      - "${RENDER_GID:-989}"                # GID del grupo de /dev/dri/renderD128 en el anfitrion
    depends_on:
      ollama: { condition: service_started, required: false }   # solo con el perfil ollama
    mem_limit: ${GLUBIA_MEM:-12g}
    stop_grace_period: 20s
    networks:
      interna:
        ipv4_address: 172.31.0.10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Motor Ollama (GLUBIA_MOTOR=ollama + COMPOSE_PROFILES=ollama). Cambiar de
  # modelo:  docker compose exec ollama ollama pull <usuario/modelo:etiqueta>
  # y luego GLUBIA_OLLAMA_MODELO en .env + docker compose up -d.
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-0.40.9}
    profiles: ["ollama"]
    restart: unless-stopped
    user: "${OLLAMA_UID:-1000}:${OLLAMA_GID:-1000}"   # los modelos quedan a tu nombre, no de root
    environment:
      HOME: /tmp
      OLLAMA_MODELS: /modelos
      OLLAMA_VULKAN: ${OLLAMA_GPU:-1}           # GPU Intel disponible por Vulkan (compose.cpu.yaml lo apaga)
      OLLAMA_IGPU_ENABLE: ${OLLAMA_GPU:-1}      # sin esto Ollama descarta las GPU integradas
    volumes:
      - ${OLLAMA_MODELOS:-./modelos/ollama}:/modelos
    ports:
      - "127.0.0.1:${PUERTO_OLLAMA:-11435}:11434"   # OLLAMA_HOST=127.0.0.1:11435 ollama list
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-989}"
    mem_limit: ${OLLAMA_MEM:-10g}
    networks:
      interna:
      salida:
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - glubia
    ports:
      - "${WEB_BIND:-127.0.0.1}:${PUERTO_PRIVADO:-8081}:8081"
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    networks:
      borde:
        ipv4_address: 172.30.0.20
      interna:
        ipv4_address: 172.31.0.20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}     # vacio = cloudflared se niega a arrancar (ver docs/OMARCHY.md)
    depends_on:
      - web
    networks:
      borde:
        ipv4_address: 172.30.0.10           # Caddy solo confia en esta IP para CF-Connecting-IP
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Tunel rapido (trycloudflare.com): sin cuenta ni token, arranca solo con el
  # equipo. La URL cambia cada vez que el contenedor se recrea; la muestra
  # scripts/vigilar.sh.
  # UI privada: solo la protege GLUBIA_PASS (sin Cloudflare Access delante).
  tunel-ui:
    image: cloudflare/cloudflared:latest
    profiles: ["tunel-rapido"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://web:8081
    depends_on:
      - web
    networks:
      borde:
        ipv4_address: 172.30.0.11           # tambien de confianza en el Caddyfile
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  interna:
    internal: true                          # sin salida a internet
    ipam:
      config: [{ subnet: 172.31.0.0/24 }]
  borde:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  salida:                                   # solo ollama: descargar modelos

volumes:
  glubia-datos:
  caddy-datos:
  caddy-config:
