[project]
name = "glubia"
dynamic = ["version"]
description = "IA local sobre OpenVINO con interfaz web propia y API compatible con OpenAI"
requires-python = ">=3.11"
authors = [{ name = "Juan Pablo Avendaño Duque" }]

[tool.setuptools.dynamic]
version = { attr = "glubia.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/historia", "respaldo_v1", "openvino_env", "modelo_qwen_7b_ov"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["B008", "UP007", "UP045", "UP035", "UP006"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["openvino: necesita openvino_genai y un modelo en GLUBIA_TEST_MODELO"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"glubia/perfil.py" = ["E501"]   # el prompt de la persona es prosa: mejor sin cortar
"portafolio/construir.py" = ["E501"]   # plantillas HTML: mejor legibles que cortadas
"scripts/medir.py" = ["E501"]
